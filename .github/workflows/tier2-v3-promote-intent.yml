name: Tier 2 v3 / Promote intent

# When an issue is labeled intent-ready, open a draft PR with intent/{slug}.md.
# Tier 1 triage may apply intent-ready when triage.promote_intent is enabled;
# program staff can also add the label manually.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  promote:
    if: github.event.label.name == 'intent-ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Promote issue to intent PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/tier2-v3/scripts/promote-intent.mjs
